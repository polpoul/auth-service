services:
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Variables d'environnement — les secrets sont à renseigner
    # dans le dashboard Render (pas ici, jamais en clair)
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false   # à renseigner dans Render dashboard > Environment
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false   # https://auth-service.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

    healthCheckPath: /health
